خصوصية",definition:"السياسة والضوابط التي تضعها الشركات لتوضيح كيفية جمع ومعالجة وحماية بيانات العملاء.",example:"صفحة سياسة الخصوصية في تطبيق توضح ماذا تجمع ولماذا.",features:["شفافية","كيف تجمع","كيف تحمي"],tag:"Privacy Policy",color:"bg-[#0a1931] border border-white/10",lesson:"2-1"}],Fn={"1-1":{label:"الدرس 1-1 : المعلومات والوسائط",goals:["التمييز بين البيانات والمعلومات والمعرفة","شرح خصائص المعلومات الثلاث: الاستمرارية، قابلية التكرار، الانتشار","التمييز بين المعلومات الأولية والثانوية وأهمية التحقق المتبادل","تصنيف الوسائط إلى تعبير ونقل وتسجيل وفهم الثقافة الإعلامية"],color:"from-[#ff7a00] to-[#ff9f1c]"},"1-2":{label:"الدرس 1-2 : أخلاقيات المعلومات",goals:["تعريف أخلاقيات المعلومات وأهميتها حتى بدون قوانين","تحديد 6 نقاط يجب مراعاتها عند نشر المعلومات","فهم مخاطر العلامة الجغرافية والمعلومات المضللة","شرح 5 مشاكل للهواتف ووسائل التواصل"],color:"from-[#0a1931] to-[#1e3a5f]"},"2-1":{label:"الدرس 2-1 : البيانات الشخصية",goals:["تعريف البيانات الشخصية وأنواعها الثلاثة","فهم قانون حماية البيانات وقاعدة الموافقة الصريحة و5 استثناءات","التمييز بين حق الخصوصية وحق الصورة وحقوق الدعاية","شرح سياسة الخصوصية وأنظمة الموافقة والاعتراض والترخيص"],color:"from-[#ff9f1c] to-[#ff7a00]"}},Em={"1-1":{mcq:[{id:1,q:"ما هو تمثيل الحقائق باستخدام الأرقام أو الأحرف أو الرموز؟",options:["البيانات","المعلومات","المعرفة","الوسائط"],correct:0,explain:"البيانات هي الحقائق الخام مثل درجات الحرارة 25، 30."},{id:2,q:"المعلومات هي:",options:["لها شكل مثل الجسم المادي","معنى أو قيمة للمتلقي لاتخاذ قرار وليس لها شكل ثابت","ورق فقط","لا تستخدم لاتخاذ قرار"],correct:1,explain:"المعلومات ليس لها شكل ثابت بل قيمة للمتلقي."},{id:3,q:"خاصية الاستمرارية تعني:",options:["إمكانية نسخ المعلومات بكميات كبيرة","بمجرد إنشاء المعلومات لا يمكن محوها بالكامل","سهولة توصيل المعلومات","اختفاء المعلومات بسرعة"],correct:1,explain:"الشائعات تستمر لأجل غير مسمى = استمرارية."},{id:4,q:"قابلية التكرار تعني:",options:["لا يمكن نسخ المعلومات","إمكانية نسخ المعلومات بسهولة بكميات كبيرة","منع النسخ","تدهور الجودة عند النسخ"],correct:1,explain:"نسخ موسيقى وأفلام بدون تدهور = قابلية تكرار."},{id:5,q:"الانتشار يعني:",options:["صعوبة توصيل المعلومات","من السهل توصيل المعلومات عبر صحف تلفزيون إنترنت","حذف المعلومات","تخزين فقط"],correct:1,explain:"إرسال بريد إلكتروني فوراً للخارج = انتشار."},{id:6,q:"المعرفة هي:",options:["بيانات خام","معلومات تم تحليلها وتنظيمها منهجياً لحل المشكلات","صورة فقط","رقم هاتف"],correct:1,explain:"توقعات الطقس بعد تحليل 10 سنوات = معرفة."},{id:7,q:"المعلومات الأولية هي:",options:["من طرف ثالث","من التجربة الشخصية المباشرة والبحث والتجارب","من التلفزيون فقط","كتاب"],correct:1,explain:"تقارير تجارب، استطلاعات تجريها بنفسك = أولية."},{id:8,q:"المعلومات الثانوية هي:",options:["تجربة شخصية","من طرف ثالث مثل كتب صحف تلفزيون","نتائج استبيان أجريته بنفسك","تجربة مختبر"],correct:1,explain:"الكتب والصحف = ثانوية وقد تحتوي تفسيرات مضافة."},{id:9,q:"التحقق المتبادل هو:",options:["حذف المعلومات","مقارنة المعلومات من مصادر متعددة لتحديد الدقة","نسخ المعلومات","نشر شائعة"],correct:1,explain:"مقارنة مصادر متعددة لمعرفة الموثوقية."},{id:10,q:"أي مما يلي وسائط تعبير؟",options:["نص، صور، صوت، فيديو","تلفزيون وراديو","ورق و USB","إنترنت"],correct:0,explain:"التعبيرية = وسيلة للتعبير عن المعلومات."},{id:11,q:"التلفزيون والراديو والإنترنت يصنفون كـ:",options:["وسائط تعبير","وسائط نقل/إرسال","وسائط تسجيل","بيانات"],correct:1,explain:"وسائط نقل تستخدم لنقل وتبادل المعلومات."},{id:12,q:"الثقافة الإعلامية هي:",options:["حذف المعلومات","القدرة على فهم معنى وخصائص الوسائط وتفسير بدقة","نسخ الأقراص","إدمان إنترنت"],correct:1,explain:"فهم معنى وخصائص الوسائط بدقة = ثقافة إعلامية."}],essay:[{id:13,q:"اشرح الفرق بين البيانات والمعلومات والمعرفة مع مثال: قيم حرارة، تحليل 10 سنوات، توقعات طقس.",model:"البيانات: قيم حرارة ورطوبة خام (1). المعلومات: نتائج تحليل 10 سنوات تعطي معنى (2). المعرفة: توقعات الطقس تساعد على حل مشكلة التخطيط (3).",points:3},{id:14,q:"اذكر خصائص المعلومات الثلاث مع مثال لكل.",model:"1- الاستمرارية: الشائعات لا تختفي. 2- قابلية التكرار: نسخ موسيقى بدون تدهور. 3- الانتشار: إرسال بريد إلكتروني للخارج فوراً.",points:3},{id:15,q:"ما الفرق بين المعلومات الأولية والثانوية؟ وما أهمية التحقق المتبادل؟",model:"الأولية من تجربة شخصية مباشرة (استطلاع). الثانوية من طرف ثالث (كتاب). التحقق المتبادل مهم لأن الثانوية قد تختلف عن الأصل أو تحتوي تفسيرات.",points:3},{id:16,q:"صنف: تلفزيون، تخزين سحابي، صورة، إنترنت، حرف نصي، كتاب.",model:"تلفزيون 2 نقل، سحابي 3 تسجيل، صورة 1 تعبير، إنترنت 2 نقل، حرف نصي 1 تعبير، كتاب 2 نقل.",points:3},{id:17,q:"لماذا قيل المعلومات ليس لها شكل ثابت؟ وما علاقة ذلك بخصائصها؟",model:"لأنها معنى وليس جسم مادي، لذلك يسهل نسخها (تكرار) ونشرها (انتشار) وصعوبة محوها (استمرارية).",points:2},{id:18,q:"أعط مثال يوضح قابلية التكرار ومثال يوضح الانتشار.",model:"التكرار: نسخ قرص موسيقي تجاري وتوزيعه. الانتشار: رسائل بريد ترسل فوراً للخارج.",points:2},{id:19,q:"كيف تطبق الثقافة الإعلامية عند قراءة خبر على الإنترنت؟",model:"أفهم نوع الوسيط وخصائصه، أفسر هل الخبر حقيقة أم رأي، أقارن بمصادر أخرى (تحقق متبادل).",points:2},{id:20,q:"نتائج امتحان تجريبي: هل هي بيانات أم معلومات أم معرفة؟ ولماذا؟",model:"درجات الامتحان الخام = بيانات. نتائج الامتحان كقائمة ناجح/راسب = معلومات. تحليل القبول في المدرسة المطلوبة = معرفة.",points:2}]},"1-2":{mcq:[{id:1,q:"أخلاقيات المعلومات هي:",options:["قانون فقط","المفاهيم والتوجهات الأساسية لأنشطة مناسبة بغض النظر عن القوانين","برنامج حاسوب","نوع USB"],correct:1,explain:"هي توجهات حتى بدون قانون."},{id:2,q:"أي مما يلي من نقاط المراعاة عند نشر المعلومات؟",options:["مشاركة صور الآخرين بدون إذن مسموح","المعلومات على الإنترنت تنتشر بسهولة ولا تختفي بسهولة","يجوز تسريب معلومات شخصية","يجوز التشهير"],correct:1,explain:"الاستمرارية: ما ينشر لا يختفي بسهولة."},{id:3,q:"العلامة الجغرافية هي:",options:["اسم المستخدم","خطوط طول وعرض مضمنة في الصور خطر تحديد المنزل","نوع خط","برنامج"],correct:1,explain:"Geotag يكشف موقع التقاط الصورة."},{id:4,q:"المعلومات المضللة والشائعات:",options:["معلومات دقيقة دائماً","معلومات كاذبة تنشر عمداً أو لا أساس لها","بيانات شخصية","قانون"],correct:1,explain:"نشر كاذب متعمد."},{id:5,q:"وسائل التواصل الاجتماعي:",options:["خدمات توفر منصات للأفراد للتواصل على الإنترنت","أقراص DVD","ورق","راديو فقط"],correct:0,explain:"Social media منصات تواصل."},{id:6,q:"إدمان الإنترنت:",options:["استخدام معتدل","انغماس مفرط يعطل الحياة اليومية","قراءة كتاب","كتابة تقرير"],correct:1,explain:"انغماس يعطل الحياة."},{id:7,q:"الجريمة الإلكترونية:",options:["استخدام هاتف أثناء المشي","إساءة استخدام الكمبيوتر والشبكات في أنشطة إجرامية","نسيان كلمة مرور","شحن هاتف"],correct:1,explain:"Cybercrime إساءة استخدام تقني."},{id:8,q:"انتحال الشخصية:",options:["تصوير طبيعة","انتحال شخصية فرد أو مؤسسة لسرقة هويات","قراءة صحيفة","تخزين سحابي"],correct:1,explain:"Identity theft سرقة هوية."},{id:9,q:"هل يجوز الكتابة بحرية على لوحة مجهولة لأن لا أحد يعرفك؟",options:["نعم مسموح التشهير","لا، لا يجوز نشر تشهير أو مضللة حتى لو مجهول","نعم انشر أي شيء","نعم مع شتائم"],correct:1,explain:"حتى المجهول لا يبرر التشهير."},{id:10,q:"مواقع الويب ملزمة قانونياً بتقديم معلومات دقيقة دائماً:",options:["صحيح دائماً","خطأ، ليست ملزمة دائماً ويجب التحقق","نعم 100%","لا يوجد إنترنت"],correct:1,explain:"ليست كل المواقع دقيقة، تحتاج تحقق متبادل."},{id:11,q:"أي سلوك مناسب لاستخدام الهاتف؟",options:["استخدامه أثناء المشي في الشارع","إيقاف تشغيله في السينما أو المتحف","تصوير مشاهير في مركز تسوق ونشرها","نشر صورة جماعية بدون إذن"],correct:1,explain:"إيقافه في السينما سلوك أخلاقي."},{id:12,q:"عند نشر معلومات يجب التأكد من:",options:["أنها تنتهك خصوصية الآخرين","أنها لا تنتهك خصوصية الآخرين وحقوق المؤلف","نشر شائعات","تسريب معلومات"],correct:1,explain:"يجب عدم انتهاك الخصوصية وحقوق المؤلف."}],essay:[{id:13,q:"اذكر 4 نقاط يجب مراعاتها عند نشر المعلومات على الإنترنت.",model:"1- الانتشار السهل وعدم الاختفاء. 2- لا مشاركة صور الآخرين بدون إذن. 3- لا تسريب معلومات شخصية. 4- لا انتهاك حقوق المؤلف. 5- لا تشهير أو تنمر.",points:4},{id:14,q:"اشرح خطر العلامة الجغرافية بمثال.",model:"الصور تحتوي إحداثيات طول وعرض، إذا نشرت صورة من المنزل يمكن تحديد عنوان المنزل والتعرض للخطر.",points:2},{id:15,q:"ما الفرق بين المعلومات المضللة والشائعات؟",model:"المضللة كاذبة عمداً لنشر تضليل، الشائعات لا أساس لها وتنتشر بدون تحقق، كلاهما خطر.",points:2},{id:16,q:"اذكر 3 مشاكل ناتجة عن الهواتف ووسائل التواصل مع مثال.",model:"إدمان إنترنت يعطل الحياة، استخدام هاتف أثناء المشي يسبب حوادث، جريمة إلكترونية كاختراق، انتحال شخصية لسرقة كلمات مرور، تسريب معلومات شخصية.",points:3},{id:17,q:"هل وسائل التواصل أداة خطيرة فقط؟ صحح العبارة.",model:"خطأ، هي أداة مريحة للتواصل لكن قد تصبح خطيرة إذا استخدمت بشكل غير صحيح بدون أخلاقيات.",points:2},{id:18,q:"موقف: صورت مشهور في مركز تسوق ونشرت الصورة لأنه مكان عام. هل هذا مناسب؟",model:"غير مناسب، يشكل انتهاكاً للخصوصية وحق الصورة وحقوق الدعاية حتى في مكان عام.",points:2},{id:19,q:"اكتب قاعدة أخلاقية واحدة تجعل استخدام الإنترنت أكثر أماناً.",model:"قبل النشر تأكد أنها لا تنتهك خصوصية الآخرين ولا تحتوي تشهير، وفكر أن هناك أشخاص حقيقيين على الجانب الآخر.",points:2},{id:20,q:"لماذا نحتاج أخلاقيات معلومات حتى مع وجود قوانين؟",model:"لأن القوانين لا تغطي كل المواقف، والأخلاقيات توجه ذاتي لسلوك مناسب يحمي الجميع حتى بدون نص قانوني.",points:3}]},"2-1":{mcq:[{id:1,q:"البيانات الشخصية هي:",options:["إحصاءات عدد السكان فقط","كل بيان يتعلق بشخص طبيعي محدد أو يمكن تحديده مباشر أو غير مباشر","لون المفضل","رقم عشوائي"],correct:1,explain:"تعريف القانون: كل بيان يحدد شخص."},{id:2,q:"أي مما يلي يعتبر بيانات شخصية؟",options:["إحصاءات مجمعة عن عدد السكان","عنوان بريد إلكتروني، بصمة إصبع، رقم جواز، حالة صحية","درجة حرارة الجو","عدد الكتب"],correct:1,explain:"الإحصاء المجمع لا يحدد فرد، الباقي يحدد."},{id:3,q:"البيانات الأساسية هي:",options:["العرق والديانة","الاسم، العنوان، تاريخ الميلاد، النوع","رقم جواز السفر","السجل الجنائي"],correct:1,explain:"الأساسية = الاسم، العنوان، الميلاد، النوع."},{id:4,q:"أرقام الهوية الشخصية:",options:["الاسم فقط","الأرقام في جواز السفر ورخصة القيادة والرقم القومي","الديانة","الرأي السياسي"],correct:1,explain:"رغم أنها أرقام إلا أنها بيانات شخصية عند الربط."},{id:5,q:"البيانات الحساسة تشمل:",options:["الاسم فقط","العرق، الديانة، آراء سياسية، صحية، اقتصادية، سجل جنائي","العنوان فقط","لون القميص"],correct:1,explain:"حساسة تحتاج عناية خاصة لمنع التمييز."},{id:6,q:"قانون حماية البيانات الشخصية ينص على:",options:["يجوز جمع البيانات بدون موافقة دائماً","لا يجوز جمع أو معالجة إلا بموافقة صريحة مع استثناءات محددة","لا يوجد قانون","الجمع عشوائي"],correct:1,explain:"القاعدة العامة موافقة صريحة."},{id:7,q:"من استثناءات تقديم البيانات لطرف ثالث بدون موافقة:",options:["للمزاح","حماية الأمن القومي، تنفيذ حكم قضائي، حماية حياة، قوانين، إتمام عقد","للبيع","للنشر على فيسبوك"],correct:1,explain:"5 استثناءات: قوانين، أمن قومي، حماية حياة، حكم قضائي، عقد."},{id:8,q:"الحق في الخصوصية:",options:["حق عادي","حق دستوري عام يحمي الحياة الخاصة، مادة 57 دستور مصري","حق للشركات فقط","لا وجود له"],correct:1,explain:"دستوري أوسع من حماية البيانات."},{id:9,q:"حق الصورة:",options:["يجوز تصوير أي شخص بدون إذن","حق الفرد في منع تصويره أو استخدام صورته دون إذن","حق للكاميرا","حق للهاتف"],correct:1,explain:"حتى صورة عائلية تحتاج إذن الجميع."},{id:10,q:"حقوق الدعاية:",options:["حماية مصالح اقتصادية للمشاهير في استغلال صورهم وأسمائهم","حق مجاني للجميع لبيع صور المشاهير","حق لطباعة قمصان مشاهير وبيعها","لا علاقة بالمشاهير"],correct:0,explain:"المشاهير لهم حق اقتصادي في صورتهم."},{id:11,q:"سياسة الخصوصية:",options:["لا أهمية لها","سياسة تضعها الشركات توضح كيفية جمع ومعالجة وحماية بيانات العملاء","ورقة فارغة","إعلان"],correct:1,explain:"توضح كيف تجمع وتحمي."},{id:12,q:"نظام الموافقة المسبقة vs نظام الاعتراض:",options:["نفس الشيء","موافقة مسبقة يشترط موافقة قبل الجمع، اعتراض يسمح حتى يعترض المستخدم","لا يوجد نظام","كلاهما يمنع الجمع"],correct:1,explain:"مسبقة = موافقة قبل، اعتراض = حتى يعترض."}],essay:[{id:13,q:"عرّف البيانات الشخصية واذكر 5 أمثلة متنوعة.",model:"كل بيان يتعلق بشخص محدد أو يمكن تحديده مباشر أو غير مباشر بالربط. أمثلة: اسم، عنوان، تاريخ ميلاد، هاتف، بريد، صورة، صوت، فيديو، رقم قومي، جواز، بصمة، قزحية.",points:3},{id:14,q:"صنف: الاسم، رقم جواز، الديانة، تاريخ الميلاد، السجل الجنائي.",model:"الاسم أساسية، جواز أرقام هوية، الديانة حساسة، تاريخ ا
